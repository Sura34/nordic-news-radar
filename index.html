<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Nordic News Radar</title><style>body{font:16px system-ui;margin:0;background:#f3f6fa;color:#182333}header{background:#101827;color:white;padding:28px max(20px,calc((100% - 1100px)/2))}h1{margin:0}main{max-width:1100px;margin:auto;padding:20px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button,input{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:white}button{cursor:pointer}button.active{background:#1d4ed8;color:white}input{width:min(95%,450px)}#articles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}.article{background:white;border:1px solid #dce4ed;border-radius:13px;padding:18px}.article a{color:#152c5c;text-decoration:none;font-weight:700;font-size:1.1rem}.article a:hover{text-decoration:underline}.meta{color:#64748b;font-size:.83rem;margin-bottom:9px}.article p{line-height:1.45}.tag{display:inline-block;background:#e5eefb;padding:3px 8px;border-radius:8px;font-size:.8rem;margin-top:10px}#status{color:#64748b}footer{padding:24px;text-align:center;color:#64748b}</style></head><body><header><h1>Nordic News Radar</h1><p>Älvängen · Göteborg · Sweden · Norway · World</p></header><main><p id="status">Loading news…</p><nav id="filters"></nav><input id="search" placeholder="Search headlines and descriptions" aria-label="Search news"> <label><input type="checkbox" id="impact" style="width:auto"> Daily-life impact</label> <button id="refresh">Refresh</button><section id="articles"></section></main><footer>Brief excerpts from public RSS feeds. Open original articles for full reporting. Updates are scheduled approximately hourly.</footer><script src="app.js"></script></body></html>
